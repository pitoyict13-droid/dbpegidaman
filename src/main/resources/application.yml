server:
  port: 8080

spring:
  application:
    name: kepegawaian-smp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # Ganti sesuai konfigurasi PostgreSQL di sekolah
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kepegawaian_smp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  output:
    ansi:
      enabled: always

app:
  jwt:
    # Ganti secret ini di produksi (minimal 32 karakter). Lebih aman via environment variable JWT_SECRET
    secret: ${JWT_SECRET:KunciRahasiaSMPUnggulanIdamanBanjarbaru2026GantiDiProduksi!}
    # Masa berlaku token: 12 jam (dalam milidetik)
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}

logging:
  level:
    org.springframework.security: INFO
