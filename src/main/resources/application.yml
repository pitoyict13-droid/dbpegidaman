server:
  # Hosting cloud (Render dkk.) menyuntikkan PORT otomatis; lokal tetap 8080
  port: ${PORT:8080}

spring:
  application:
    name: dapodik-smp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # Bisa dioverride penuh via SPRING_DATASOURCE_URL, atau per-bagian via DB_HOST/DB_PORT/DB_NAME/DB_PARAMS
    # Contoh Neon (butuh SSL): set DB_PARAMS=?sslmode=require
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kepegawaian_smp}${DB_PARAMS:}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  output:
    ansi:
      enabled: always
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

app:
  # Folder penyimpanan lampiran surat (arsip persuratan)
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt:
    # Ganti secret ini di produksi (minimal 32 karakter). Lebih aman via environment variable JWT_SECRET
    secret: ${JWT_SECRET:KunciRahasiaSMPUnggulanIdamanBanjarbaru2026GantiDiProduksi!}
    # Masa berlaku token: 12 jam (dalam milidetik)
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}

logging:
  level:
    org.springframework.security: INFO
